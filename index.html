<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EDEBDC" />
    <meta
      name="description"
      content="RaeMa's Remedies — handcrafted tallow skincare and herbal remedies made in small batches in Tattnall County, Georgia."
    />

    <!--
      Open Graph, so a link shared on Facebook (or anywhere that reads OG)
      unfurls with the emblem and the shop's own words instead of a bare
      URL. The description repeats the meta description above verbatim.
      og:image must be an absolute URL — crawlers don't resolve relative
      paths — so it hard-codes the GitHub Pages address.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RaeMa's Remedies" />
    <meta property="og:title" content="RaeMa's Remedies | Tallow · Herbs · Home · Health" />
    <meta
      property="og:description"
      content="RaeMa's Remedies — handcrafted tallow skincare and herbal remedies made in small batches in Tattnall County, Georgia."
    />
    <meta property="og:url" content="https://rardo711.github.io/Raemas-Remedies-Website-idea/" />
    <meta
      property="og:image"
      content="https://rardo711.github.io/Raemas-Remedies-Website-idea/assets/brand/logo-main.png"
    />

    <!--
      Favicon: a square crop of the emblem in logo-main.png.
      See public/assets/brand/README.md for how to produce favicon.png.
      The .ico fallback line can be deleted once favicon.png exists.
    -->
    <link rel="icon" type="image/png" href="./assets/brand/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/brand/favicon.png" />

    <title>RaeMa's Remedies | Tallow · Herbs · Home · Health</title>
  </head>
  <body>
    <!--
      React replaces everything inside #root as soon as it mounts, so what sits
      here is only ever seen when the script below never ran — which on GitHub
      Pages almost always means the site is being served straight from the
      repository instead of from the built output. The styles are inline on
      purpose: in that situation the CSS bundle has not loaded either. See the
      Troubleshooting section of README.md.
    -->
    <div id="root">
      <div style="font-family: Georgia, serif; color: #2B2118; background: #EDEBDC; padding: 3rem 1.5rem; text-align: center">
        <p style="font-size: 1.5rem; margin: 0 0 0.75rem">RaeMa&rsquo;s Remedies</p>
        <p style="margin: 0 0 0.75rem">Loading&hellip;</p>
        <p style="font-size: 0.875rem; opacity: 0.7; margin: 0">
          If this message stays put, the page&rsquo;s JavaScript did not load.
        </p>
      </div>
    </div>
    <noscript>
      <div style="font-family: Georgia, serif; color: #2B2118; background: #EDEBDC; padding: 1.5rem; text-align: center">
        This site needs JavaScript switched on to show the remedies.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
